name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Biome, ESLint, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` input on purpose — action-setup then reads the
      # `packageManager` pin from package.json, so the pin stays authoritative.
      # Must run before setup-node, which needs pnpm on PATH for `cache: pnpm`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    # The Playwright webServer allows 300s just for the production build, on top
    # of install and the browser download.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Safe with or without a cache hit: an already-present browser is not
      # re-downloaded, and the OS-level deps are installed either way.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # No build or server step here on purpose: playwright.config.ts owns both
      # via its `webServer`, which builds into .next-e2e (NEXT_DIST_DIR).
      # Its CI reporter is `github`, which emits annotations but writes no report
      # directory, so `html` is added on the CLI to leave something uploadable.
      - name: Run Playwright tests
        run: pnpm test:e2e --reporter=github,html

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
